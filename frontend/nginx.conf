# HTTP: solo redirige a HTTPS (Cloudflare Full-strict habla HTTPS con el origen)
server {
  listen 80;
  server_name frutransport.luisepzsls.dev;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name frutransport.luisepzsls.dev;

  # Certificado Origin CA de Cloudflare — montado en runtime (ver docker-compose.prod.yml), no vive en el repo.
  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;

  root /usr/share/nginx/html;
  index index.html;

  # API → backend Express (mismo rol que el proxy de Vite en desarrollo)
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA: cualquier ruta desconocida sirve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
